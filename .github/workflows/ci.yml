name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `--include=dev` is explicit on purpose: if NODE_ENV ever leaks in as
      # `production`, npm silently skips devDependencies (typescript, tsx) and
      # the next step fails with a confusing "tsc: not found".
      - name: Install dependencies
        run: npm ci --include=dev

      # No secrets are provided to any step on purpose. The build, typecheck
      # and tests must not depend on env config that only exists locally or on
      # Vercel — `ask_about_edgeorgie` runs in deterministic retrieval mode
      # when no LLM key is set, which is what the suite asserts.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # `--omit=dev` is the deliberate scope, not laziness. All 11 advisories
      # in this repo resolve to a single devDependency subtree: `@vercel/node`
      # pulls undici/@fastify/busboy, ts-morph/ajv and fast-glob/micromatch/
      # braces. Nothing in that subtree reaches the deployed function —
      # `@vercel/node` is used exclusively as `import type { VercelRequest,
      # VercelResponse }` (grep the `api/` handlers: every import of it is a
      # type-only import, erased by `tsc`), and Vercel supplies the real
      # runtime. `npm audit fix --force` would downgrade it a major version to
      # silence vulnerabilities that never ship.
      #
      # The production tree (`@modelcontextprotocol/sdk`, `express`, `zod`,
      # `@edgeorgie/retrieval-core`) is currently 0 findings, so this gate
      # starts green and fails the day something actually shipped regresses.
      # Separate step from the suite so an advisory reads as an advisory, not a
      # test failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
