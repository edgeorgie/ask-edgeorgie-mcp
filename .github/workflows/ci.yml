name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `--include=dev` is explicit on purpose: if NODE_ENV ever leaks in as
      # `production`, npm silently skips devDependencies (typescript, tsx) and
      # the next step fails with a confusing "tsc: not found".
      - name: Install dependencies
        run: npm ci --include=dev

      # No secrets are provided to any step on purpose. The build, typecheck
      # and tests must not depend on env config that only exists locally or on
      # Vercel — `ask_about_edgeorgie` runs in deterministic retrieval mode
      # when no LLM key is set, which is what the suite asserts.
      - name: Typecheck
        run: npx tsc --noEmit

      # tsconfig.json's `include` is src/**/*.ts, because src/ is what the
      # build emits to dist/. So the step above covers NONE of api/, tests/ or
      # examples/, and `tsx` strips types without checking them, so the suite
      # cannot notice either. Measured, not assumed: a type error planted in
      # api/projects.ts left `tsc --noEmit` exit 0, `npm run build` exit 0 and
      # the full suite green.
      #
      # api/ is the worst possible place for that blind spot, because those
      # five files are not helpers — they ARE the deployed Vercel serverless
      # functions (/api/ask, /api/mcp, /api/projects, /api/experience,
      # /api/story). The production request handlers were the code this repo's
      # CI checked least. tests/ and examples/ matter for a second reason:
      # they hold the derived guards the README's claims rest on and the
      # generator for the committed evidence transcripts.
      #
      # Same planted error against this config: exit 2.
      - name: Typecheck api, tests and examples
        run: npx tsc -p tsconfig.check.json

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # SCOPE: `--omit=dev`, and this is NOT the claim that dev dependencies
      # cannot affect what ships. In general they can — a compiler or bundler is
      # a devDependency whose OUTPUT is the artifact. That class of build-time
      # supply-chain compromise is blind to this flag. What covers part of it:
      # `npm ci` pins every install to the committed lockfile, and
      # `.github/dependabot.yml` keeps those pins under weekly review. Both only
      # react to published advisories against known versions, so a package that
      # is malicious before any advisory exists still gets in — that gap is
      # narrowed here, not closed.
      #
      # The narrower claim this rests on is about the advisories actually
      # present. All of them resolve to one devDependency, `@vercel/node`:
      #   @vercel/node
      #     ├─ undici -> @fastify/busboy        (high x2)
      #     ├─ ts-morph -> @ts-morph/common
      #     │    ├─ fast-glob -> micromatch -> braces   (high)
      #     │    └─ (via @vercel/static-config) ajv      (moderate)
      #     └─ path-to-regexp@6                          (high)
      # `@vercel/node` is consumed here only as a type: every reference in
      # `api/` is `import type { VercelRequest, VercelResponse }`, erased by
      # `tsc`, with Vercel supplying the real runtime — so none of that subtree
      # is in the deployed function, and nothing in it runs at build time
      # either. `npm audit fix --force` would downgrade it a major version
      # (23 -> 4) to silence findings in code that never executes.
      #
      # Note `path-to-regexp` appears in BOTH trees: 6.1.0 under @vercel/node
      # (flagged) and 8.4.2 under express -> router (unaffected). The prod-only
      # scope keeps the express path, which is the one that actually serves
      # requests.
      #
      # Known gap: `@edgeorgie/retrieval-core` is a git dependency, so npm audit
      # has no advisory data for it and it is absent from the audit graph
      # entirely. It declares no dependencies of its own, and it has its own CI.
      #
      # The rest of the production tree (@modelcontextprotocol/sdk, express,
      # zod) is 0 findings today, so this gate starts green and fails when
      # something reachable regresses. Separate step from the suite so an
      # advisory reads as an advisory, not as a test failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
